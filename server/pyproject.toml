[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vgit-server"
version = "0.1.0"
description = "Custom server foundation for GitVibe knowledge repositories"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vgit-server = "vgit_server.app:main"

[tool.setuptools.packages.find]
where = ["src"]
